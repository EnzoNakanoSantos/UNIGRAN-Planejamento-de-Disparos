<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&amp;display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Planejamento de Disparos de E-mails</title>
    <script>
      (function () {
        var themeKey = 'planner-theme';
        var savedTheme = '';
        try {
          var match = document.cookie.match(new RegExp('(?:^|; )' + themeKey.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)'));
          savedTheme = match ? decodeURIComponent(match[1]) : '';
        } catch {}
        try {
          savedTheme = savedTheme || window.localStorage.getItem(themeKey) || '';
        } catch {}
        var theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
